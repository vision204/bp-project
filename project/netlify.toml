# ---------------------------------------------------------------------------
# Netlify 배포 설정
#
# 깃 저장소를 Netlify에 연결해두면, 푸시할 때마다 이 설정대로 알아서 빌드해서 올립니다.
# 파이어베이스 설정값은 소스에 들어 있으므로 Netlify 쪽에 환경변수를 넣을 필요가 없습니다.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 이 게임은 페이지가 하나뿐이라, 어떤 주소로 들어와도 index.html을 돌려줍니다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
